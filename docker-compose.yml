services:
  php:
    build: { context: ., dockerfile: docker/php.Dockerfile }
    command: sh -c "chown -R www-data:www-data storage bootstrap/cache && php-fpm"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: mislucas
      DB_USERNAME: mislucas
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
    volumes: [".:/var/www/html"]
    depends_on: [db]
  scheduler:
    build: { context: ., dockerfile: docker/php.Dockerfile }
    command: php artisan schedule:work
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: mislucas
      DB_USERNAME: mislucas
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
    volumes: [".:/var/www/html"]
    depends_on: [db]
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: [".:/var/www/html", "./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [php]
  node:
    image: node:24-alpine
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports: ["5173:5173"]
    volumes: [".:/app"]
  db:
    image: mariadb:11.4
    ports: ["127.0.0.1:3307:3306"]
    environment:
      MARIADB_DATABASE: mislucas
      MARIADB_USER: mislucas
      MARIADB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD in .env}
    volumes: ["db-data:/var/lib/mysql"]
volumes: { db-data: {} }
